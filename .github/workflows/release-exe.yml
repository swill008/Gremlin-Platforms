name: Release EXE installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "latest"

      - name: Install dependencies
        run: poetry install

      - name: Build executable
        run: poetry run pyinstaller -y --clean joystick_gremlin.spec

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\gremlin_platforms\* -DestinationPath dist\Gremlin-Platforms-R1-1.0.0.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Gremlin-Platforms-R1-1.0.0
          name: Gremlin-Platforms-R1 1.0.0
          body: |
            Portable standalone build Gremlin-Platforms-R1 1.0.0.

            Logical Device, Status compact view, HiDHide list scroll, mode sync, catalog and output page lifetime.

            Unzip anywhere (Documents, Desktop, etc). Do not put it in Program Files.
            Run gremlin_platforms.exe from the unzipped folder.

            Requires vJoy already installed.
            Unsigned build — SmartScreen may warn on first run.
          files: dist/Gremlin-Platforms-R1-1.0.0.zip
          token: ${{ secrets.GITHUB_TOKEN }}
