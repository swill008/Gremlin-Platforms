name: Release EXE installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (off: build only, files kept as a workflow artifact)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v2
        with:
          # The Poetry that wrote poetry.lock (its first line); never "latest".
          poetry-version: "2.4.3"

      # Only the locked versions go into the exe (see ci.yml).
      - name: Check poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry sync --no-interaction

      # What this exe is built from, on the run's summary page.
      - name: Record the package versions
        shell: bash
        run: |
          {
            echo "### Built with"
            echo '```'
            poetry run python --version
            poetry run python -m pip list --format=freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The in-app updater finds the release by these names, so they all come
      # from version.json.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      # Each version's notes live in release-notes/<version>.md
      # (D-REL-NOTES-FILES); stop before building when they are missing.
      - name: Release notes
        shell: pwsh
        run: |
          poetry run python tools/release_body.py ${{ steps.version.outputs.version }} --out release-body.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build executable
        run: poetry run pyinstaller -y --clean joystick_gremlin.spec

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\gremlin_platforms\* -DestinationPath dist\Gremlin-Platforms-R1-${{ steps.version.outputs.version }}.zip

      - name: Build installer
        shell: pwsh
        run: installer\build_installer.ps1

      - name: Keep build files
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: Gremlin-Platforms-R1-${{ steps.version.outputs.version }}
          path: |
            dist/Gremlin-Platforms-R1-${{ steps.version.outputs.version }}-Setup.exe
            dist/Gremlin-Platforms-R1-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Gremlin-Platforms-R1-${{ steps.version.outputs.version }}
          name: Gremlin-Platforms-R1 ${{ steps.version.outputs.version }}
          body_path: release-body.md
          files: |
            dist/Gremlin-Platforms-R1-${{ steps.version.outputs.version }}-Setup.exe
            dist/Gremlin-Platforms-R1-${{ steps.version.outputs.version }}.zip
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
