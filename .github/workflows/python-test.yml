name: CI Tests

on:
  # Run by hand only (Actions > this workflow > Run workflow): pushes and
  # pull requests no longer start it (and no longer send failure emails).
  # The tests are run on the PC before every commit (test/run_tests.py).
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR' ||
       contains(github.event.pull_request.labels.*.name, 'gh-actions-manager'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "latest"

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests
        run: poetry run pytest test/unit

      - name: Run integration tests
        run: poetry run pytest test/integration/action_plugins

      - name: Run action_interaction tests
        run: poetry run pytest test/action_interaction
