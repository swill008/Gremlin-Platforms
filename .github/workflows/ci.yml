# CI: the safety net (stage 1 of the plan in claude/system-maps.md).
#
# On every push and pull request to Gremlin-Platforms, on Windows with Python 3.13:
#   1. Lint against the baseline: tools/pyright_baseline.py runs pyright and
#      ruff and fails on any error not in tools/pyright_baseline.json (the
#      errors there today are allowed until fixed; fixed ones are listed).
#      pyright and ruff are installed at the versions the baseline was made
#      with, since another version finds other errors.
#   2. The full test suite (test/run_tests.py) in random order, so tests
#      that only pass in one order (shared state left behind) show up. The
#      seed is printed: rerun the same order on the PC with
#      `python test/run_tests.py --seed N`.
# Off-screen only: no screen, no network (GREMLIN_OFFLINE), a throwaway user
# folder. vJoy, ViGEm, HidHide and joysticks aren't on the runner; the tests
# use the fakes in test/ (fake_hardware.py, fake_input.py).
#
# Speed (to-do 16): the Poetry environment is kept in the Actions cache and
# brought up to date by "poetry install" (no lock file: it still resolves
# each run), and test/unit is split into 3 parts by the last run's file
# times (kept in the cache; test/test_times.json before there are any).

name: CI

on:
  # One branch only: every push also goes to develop, and running CI there
  # too doubled each run and each failure email (user, 2026-10-07).
  push:
    branches: ["Gremlin-Platforms"]
  pull_request:
    branches: ["Gremlin-Platforms"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts
      GREMLIN_OFFLINE: "1"
      PYTHONUTF8: "1"
      # The runner is slower than a desktop: the main window's first QML load
      # can pass the hang watch's 10 s (test/hang_trace/stall_watch.py) with no
      # hang. The stall tests set their own limit.
      GREMLIN_TEST_STALL_AFTER: "30"
      # A unit part ran ~8-11 min on the runner with 2 parts (10 min stopped
      # a part that was still passing, run 37686302017). The stall watch above
      # still catches a hung test.
      GREMLIN_TEST_PART_LIMIT: "1500"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history: test_spec_line.py checks every commit's Spec: line.
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "latest"

      # The environment from an earlier run (it names the exact Python it was
      # made with). "poetry install" below still resolves pyproject.toml and
      # updates whatever changed, so a kept environment is never stale.
      - name: Restore the Poetry environment
        id: venv-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/pypoetry/Cache/virtualenvs
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      # poetry.lock is not in the repository: poetry resolves pyproject.toml.
      - name: Install dependencies
        id: install
        run: poetry install --no-interaction

      - name: Install the baseline's pyright and ruff versions
        run: poetry run python -m pip install $(poetry run python tools/pyright_baseline.py --pins)

      # Kept straight after the install (not at the end), so a run whose
      # tests fail still keeps it.
      - name: Keep the Poetry environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/pypoetry/Cache/virtualenvs
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      # The last run's file times, so the unit parts end near the same time.
      - name: Restore the test times
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/test-state
          key: test-times-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-times-${{ runner.os }}-

      - name: Lint (no new pyright or ruff errors)
        run: poetry run python tools/pyright_baseline.py

      - name: Tests in random order
        id: tests
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: |
          # The project's Python, found before USERPROFILE changes: poetry keeps
          # its environments under the user profile, so with the temp profile
          # "poetry run" made an empty environment and no test ran.
          py="$(poetry env info --executable)"
          "$py" -c "import pytest, PySide6" || exit 1
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          export USERPROFILE="$(cygpath -w "$home")"
          export GREMLIN_TEST_STATE="$(cygpath -w "$RUNNER_TEMP/test-state")"
          # The runner has 4 cores: 3 unit parts, the other folders (done in
          # under 2 min) beside them. With 2 parts two cores sat idle for the
          # last 6 of 8 min (run 37687912233).
          "$py" test/run_tests.py --random-order --parts 3

      - name: Keep the test times
        if: always() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/test-state
          key: test-times-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the test log
        if: failure()
        run: cp "$(poetry run python -c 'import tempfile; print(tempfile.gettempdir())')/gremlin-test-run.log" . || true

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-test-run-log
          path: gremlin-test-run.log
          if-no-files-found: ignore
