<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1330" viewBox="0 0 880 1330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="1330" fill="#121212"/>
  <!-- title bar -->
  <rect width="880" height="40" fill="#202020"/>
  <text x="16" y="27" fill="#bbbbbb" font-size="15">✈</text>
  <text x="44" y="26" fill="#e6e6e6" font-size="15">Gremlin-Platforms R1 1.0.38 - Screen Saver Mode</text>
  <text x="760" y="27" fill="#cfcfcf" font-size="16">—</text>
  <rect x="805" y="15" width="12" height="12" fill="none" stroke="#cfcfcf"/>
  <text x="848" y="28" fill="#cfcfcf" font-size="17">✕</text>

  <!-- switch -->
  <rect x="24" y="62" width="54" height="26" rx="13" fill="#4a64e8"/>
  <circle cx="65" cy="75" r="8" fill="#ffffff"/>
  <text x="92" y="82" fill="#f0f0f0" font-size="19" font-weight="600">Screen Saver Mode</text>
  <text x="24" y="116" fill="#a8a8a8" font-size="14">Keeps its own idle time from your keyboard and mouse only, so sticks and other devices that never go quiet</text>
  <text x="24" y="135" fill="#a8a8a8" font-size="14">can't keep your screens on. Works only while Gremlin-Platforms is open.</text>

  <!-- Action -->
  <text x="24" y="172" fill="#f0f0f0" font-size="17" font-weight="600">Action</text>
  <line x1="24" y1="182" x2="856" y2="182" stroke="#3a3a3a"/>
  <circle cx="40" cy="208" r="10" fill="none" stroke="#cfcfcf" stroke-width="2"/>
  <text x="60" y="214" fill="#e6e6e6" font-size="16">Screen saver</text>
  <circle cx="240" cy="208" r="10" fill="none" stroke="#4a64e8" stroke-width="2"/>
  <circle cx="240" cy="208" r="5" fill="#4a64e8"/>
  <text x="260" y="214" fill="#e6e6e6" font-size="16">Power off displays</text>

  <!-- Wait time -->
  <text x="24" y="254" fill="#f0f0f0" font-size="17" font-weight="600">Wait time</text>
  <line x1="24" y1="264" x2="856" y2="264" stroke="#3a3a3a"/>
  <rect x="24" y="276" width="150" height="34" rx="3" fill="#1e1e1e" stroke="#4a4a4a"/>
  <text x="36" y="299" fill="#7d7d7d" font-size="15">5 min</text>
  <text x="190" y="299" fill="#d0d0d0" font-size="15">Windows' display-off time (5 min)</text>
  <text x="24" y="330" fill="#8f8f8f" font-size="13">Type a time to use your own; clear it to go back to Windows' time.</text>
  <rect x="24" y="344" width="54" height="26" rx="13" fill="#4a64e8"/>
  <circle cx="65" cy="357" r="8" fill="#ffffff"/>
  <text x="92" y="363" fill="#e6e6e6" font-size="16">Hold off during full-screen programs</text>

  <!-- Status -->
  <text x="24" y="408" fill="#f0f0f0" font-size="17" font-weight="600">Status</text>
  <line x1="24" y1="418" x2="856" y2="418" stroke="#3a3a3a"/>
  <text x="24" y="444" fill="#5fd38a" font-size="15">Listening to the keyboard and mouse</text>
  <text x="24" y="472" fill="#e6e6e6" font-size="15">Your idle time: 0 s</text>
  <text x="180" y="472" fill="#a8a8a8" font-size="14">last reset by: input sent by a program, 8 times a minute</text>
  <text x="24" y="498" fill="#a8a8a8" font-size="15">Windows' idle time: 0 s  (devices are keeping Windows awake)</text>
  <text x="24" y="524" fill="#e0a23a" font-size="15">On hold: a full-screen program is in front (StarCitizen.exe)</text>

  <!-- section: Devices -->
  <text x="24" y="572" fill="#f0f0f0" font-size="17" font-weight="600">What keeps the PC awake</text>
  <line x1="24" y1="582" x2="856" y2="582" stroke="#3a3a3a"/>

  <rect x="24" y="598" width="832" height="190" rx="4" fill="#171717" stroke="#2e2e2e"/>
  <text x="40" y="624" fill="#f0f0f0" font-size="16" font-weight="600">Devices</text>
  <rect x="660" y="604" width="180" height="34" rx="2" fill="#3a3a3a"/>
  <text x="692" y="627" fill="#f0f0f0" font-size="15">Refresh Devices</text>
  <text x="40" y="648" fill="#8f8f8f" font-size="13">Devices that never go quiet and keep Windows' idle time at 0. Screen Saver Mode ignores them.</text>
  <text x="40" y="676" fill="#9a9a9a" font-size="13">Device</text>
  <text x="740" y="676" fill="#9a9a9a" font-size="13">Reports / s</text>
  <text x="40" y="702" fill="#e6e6e6" font-size="14">PD200X Podcast Microphone</text><text x="790" y="702" fill="#e6e6e6" font-size="14">18</text>
  <text x="40" y="726" fill="#e6e6e6" font-size="14">VKBsim Gladiator EVO R</text><text x="790" y="726" fill="#e6e6e6" font-size="14">12</text>
  <text x="40" y="750" fill="#e6e6e6" font-size="14">VKBsim Gladiator EVO OT L</text><text x="790" y="750" fill="#e6e6e6" font-size="14">12</text>
  <text x="40" y="774" fill="#e6e6e6" font-size="14">VKBSim NXT SEM THQ FSM.GA</text><text x="790" y="774" fill="#e6e6e6" font-size="14">12</text>

  <!-- section: Programs -->
  <rect x="24" y="804" width="832" height="170" rx="4" fill="#171717" stroke="#2e2e2e"/>
  <text x="40" y="830" fill="#f0f0f0" font-size="16" font-weight="600">Programs</text>
  <rect x="660" y="810" width="180" height="34" rx="2" fill="#3a3a3a"/>
  <text x="680" y="833" fill="#e0a23a" font-size="14">🛡</text>
  <text x="702" y="833" fill="#f0f0f0" font-size="15">Refresh Programs</text>
  <text x="40" y="854" fill="#8f8f8f" font-size="13">Programs keeping the display on. These hold Screen Saver Mode off until they stop. Needs administrator rights.</text>
  <text x="40" y="882" fill="#9a9a9a" font-size="13">Program</text>
  <text x="730" y="882" fill="#9a9a9a" font-size="13">Ignore</text>
  <text x="40" y="910" fill="#e6e6e6" font-size="14">RustDesk.exe</text>
  <text x="40" y="928" fill="#8f8f8f" font-size="12">also keeps the PC awake</text>
  <rect x="770" y="896" width="50" height="24" rx="12" fill="#4a64e8"/><circle cx="808" cy="908" r="7" fill="#fff"/>
  <text x="40" y="956" fill="#e6e6e6" font-size="14">chrome.exe</text>
  <text x="130" y="956" fill="#8f8f8f" font-size="12">a video is playing</text>
  <rect x="770" y="942" width="50" height="24" rx="12" fill="none" stroke="#9a9a9a" stroke-width="2"/><circle cx="782" cy="954" r="6" fill="#9a9a9a"/>

  <!-- section: System -->
  <rect x="24" y="990" width="832" height="200" rx="4" fill="#171717" stroke="#2e2e2e"/>
  <text x="40" y="1016" fill="#f0f0f0" font-size="16" font-weight="600">System</text>
  <rect x="660" y="996" width="180" height="34" rx="2" fill="#3a3a3a"/>
  <text x="680" y="1019" fill="#e0a23a" font-size="14">🛡</text>
  <text x="702" y="1019" fill="#f0f0f0" font-size="15">Refresh System</text>
  <text x="40" y="1040" fill="#8f8f8f" font-size="13">Programs, drivers and services keeping the PC awake. They stop sleep, not the screens. Needs administrator rights.</text>
  <text x="40" y="1068" fill="#9a9a9a" font-size="13">Program, driver or service</text>
  <text x="730" y="1068" fill="#9a9a9a" font-size="13">Ignore</text>
  <text x="40" y="1096" fill="#e6e6e6" font-size="14">USB Audio 2.0 (USB\VID_0DB0&amp;PID_CD0E…)</text>
  <text x="330" y="1096" fill="#8f8f8f" font-size="12">(driver)</text>
  <text x="40" y="1114" fill="#8f8f8f" font-size="12">An audio stream is currently in use.</text>
  <rect x="770" y="1082" width="50" height="24" rx="12" fill="#4a64e8"/><circle cx="808" cy="1094" r="7" fill="#fff"/>
  <text x="40" y="1142" fill="#e6e6e6" font-size="14">FxSound Audio Enhancer</text>
  <text x="200" y="1142" fill="#8f8f8f" font-size="12">(driver)</text>
  <rect x="770" y="1128" width="50" height="24" rx="12" fill="#4a64e8"/><circle cx="808" cy="1140" r="7" fill="#fff"/>
  <text x="40" y="1172" fill="#e6e6e6" font-size="14">claude.exe</text>
  <text x="120" y="1172" fill="#8f8f8f" font-size="12">Electron</text>
  <rect x="770" y="1158" width="50" height="24" rx="12" fill="none" stroke="#9a9a9a" stroke-width="2"/><circle cx="782" cy="1170" r="6" fill="#9a9a9a"/>

  <text x="24" y="1220" fill="#8f8f8f" font-size="13">USB Audio 2.0 (USB\VID_0DB0&amp;PID_CD0E…) is ignored: it no longer keeps the PC awake.</text>

  <text x="24" y="1310" fill="#555" font-size="12">Mock-up only (spec page 12 with the three sections), not the program.</text>
</svg>
