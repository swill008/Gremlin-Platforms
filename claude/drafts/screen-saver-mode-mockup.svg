<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1160" viewBox="0 0 880 1160" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="1160" fill="#121212"/>
  <!-- title bar -->
  <rect width="880" height="40" fill="#202020"/>
  <text x="16" y="27" fill="#bbbbbb" font-size="15">✈</text>
  <text x="44" y="26" fill="#e6e6e6" font-size="15">Gremlin-Platforms R1 1.0.37 - Screen Saver Mode</text>
  <text x="760" y="27" fill="#cfcfcf" font-size="16">—</text>
  <rect x="805" y="15" width="12" height="12" fill="none" stroke="#cfcfcf"/>
  <text x="848" y="28" fill="#cfcfcf" font-size="17">✕</text>

  <!-- top band -->
  <rect x="24" y="60" width="832" height="116" rx="4" fill="#1a1a1a" stroke="#3a3a3a"/>
  <rect x="44" y="80" width="54" height="26" rx="13" fill="#4a64e8"/>
  <circle cx="85" cy="93" r="8" fill="#ffffff"/>
  <text x="112" y="100" fill="#f0f0f0" font-size="19">Screen Saver Mode</text>
  <text x="44" y="134" fill="#a8a8a8" font-size="14">Keeps its own idle time from your keyboard and mouse only, so sticks and other devices</text>
  <text x="44" y="154" fill="#a8a8a8" font-size="14">that never go quiet can't keep your screens on. Works only while Gremlin-Platforms is open.</text>

  <!-- Action -->
  <text x="24" y="214" fill="#f0f0f0" font-size="17" font-weight="600">Action</text>
  <line x1="24" y1="224" x2="856" y2="224" stroke="#3a3a3a"/>
  <circle cx="40" cy="254" r="10" fill="none" stroke="#cfcfcf" stroke-width="2"/>
  <text x="60" y="260" fill="#e6e6e6" font-size="16">Screen saver</text>
  <circle cx="240" cy="254" r="10" fill="none" stroke="#4a64e8" stroke-width="2"/>
  <circle cx="240" cy="254" r="5" fill="#4a64e8"/>
  <text x="260" y="260" fill="#e6e6e6" font-size="16">Power off displays</text>

  <!-- Wait time -->
  <text x="24" y="306" fill="#f0f0f0" font-size="17" font-weight="600">Wait time</text>
  <line x1="24" y1="316" x2="856" y2="316" stroke="#3a3a3a"/>
  <rect x="24" y="332" width="150" height="34" rx="3" fill="#1e1e1e" stroke="#4a4a4a"/>
  <text x="36" y="355" fill="#7d7d7d" font-size="15">5 min</text>
  <text x="152" y="355" fill="#7d7d7d" font-size="14">✕</text>
  <text x="196" y="346" fill="#d0d0d0" font-size="14">Windows' display-off time (5 min)</text>
  <text x="196" y="366" fill="#8f8f8f" font-size="13">Type a time to use your own; clear it to go back to Windows' time.</text>

  <rect x="24" y="398" width="54" height="26" rx="13" fill="#4a64e8"/>
  <circle cx="65" cy="411" r="8" fill="#ffffff"/>
  <text x="92" y="417" fill="#e6e6e6" font-size="16">Hold off during full-screen programs</text>

  <!-- Status -->
  <text x="24" y="470" fill="#f0f0f0" font-size="17" font-weight="600">Status</text>
  <line x1="24" y1="480" x2="856" y2="480" stroke="#3a3a3a"/>
  <circle cx="34" cy="504" r="6" fill="#3ccf6e"/>
  <text x="48" y="509" fill="#d6d6d6" font-size="15">Listening to the keyboard and mouse</text>
  <text x="24" y="542" fill="#d6d6d6" font-size="15">Your idle time:</text>
  <text x="200" y="542" fill="#f0f0f0" font-size="15">2 min 41 s</text>
  <rect x="300" y="530" width="300" height="14" rx="3" fill="#2a2a2a"/>
  <rect x="300" y="530" width="161" height="14" rx="3" fill="#e0a23a"/>
  <text x="616" y="542" fill="#e0a23a" font-size="15">On hold</text>
  <text x="24" y="572" fill="#d6d6d6" font-size="15">Windows' idle time:</text>
  <text x="200" y="572" fill="#f0f0f0" font-size="15">0 s</text>
  <text x="300" y="572" fill="#a8a8a8" font-size="14">devices are keeping Windows awake</text>
  <text x="24" y="602" fill="#e0a23a" font-size="14">On hold: a program is keeping the display on (chrome.exe). The countdown starts again when it stops.</text>

  <!-- Devices and programs -->
  <text x="24" y="652" fill="#f0f0f0" font-size="17" font-weight="600">What keeps the PC awake</text>
  <line x1="24" y1="662" x2="856" y2="662" stroke="#3a3a3a"/>

  <rect x="24" y="678" width="170" height="38" rx="2" fill="#3a3a3a"/>
  <text x="48" y="703" fill="#f0f0f0" font-size="16">Refresh Devices</text>
  <text x="24" y="738" fill="#8f8f8f" font-size="13">Lists the devices that never go quiet and keep</text>
  <text x="24" y="756" fill="#8f8f8f" font-size="13">Windows thinking someone is using the PC.</text>

  <rect x="446" y="678" width="180" height="38" rx="2" fill="#3a3a3a"/>
  <text x="468" y="703" fill="#f0f0f0" font-size="16">Refresh Programs</text>
  <text x="634" y="703" fill="#e0a23a" font-size="15">🛡</text>
  <text x="446" y="738" fill="#8f8f8f" font-size="13">Lists the programs asking Windows to keep the display</text>
  <text x="446" y="756" fill="#8f8f8f" font-size="13">on. Needs administrator rights each time.</text>

  <!-- devices list -->
  <rect x="24" y="776" width="404" height="32" fill="#1c1c1c"/>
  <text x="36" y="797" fill="#9a9a9a" font-size="13">Device</text>
  <text x="330" y="797" fill="#9a9a9a" font-size="13">Reports / s</text>
  <rect x="24" y="810" width="404" height="40" rx="3" fill="#1a1a1a" stroke="#333"/>
  <text x="36" y="835" fill="#e6e6e6" font-size="14">VKBSim NXT SEM THQ FSM.GA</text>
  <text x="360" y="835" fill="#e6e6e6" font-size="14">13</text>
  <rect x="24" y="854" width="404" height="40" rx="3" fill="#1a1a1a" stroke="#333"/>
  <text x="36" y="879" fill="#e6e6e6" font-size="14">PD200X Microphone (buttons)</text>
  <text x="360" y="879" fill="#e6e6e6" font-size="14">18</text>
  <text x="24" y="916" fill="#8f8f8f" font-size="12">Checked 09:31 · Screen Saver Mode ignores these.</text>

  <!-- programs list -->
  <rect x="446" y="776" width="410" height="32" fill="#1c1c1c"/>
  <text x="458" y="797" fill="#9a9a9a" font-size="13">Program</text>
  <text x="600" y="797" fill="#9a9a9a" font-size="13">Asks for</text>
  <text x="712" y="797" fill="#9a9a9a" font-size="13">Ignore this program</text>
  <rect x="446" y="810" width="410" height="40" rx="3" fill="#1a1a1a" stroke="#333"/>
  <text x="458" y="835" fill="#e6e6e6" font-size="14">RustDesk.exe</text>
  <text x="600" y="835" fill="#e6e6e6" font-size="14">Display</text>
  <rect x="750" y="818" width="50" height="24" rx="12" fill="#4a64e8"/>
  <circle cx="788" cy="830" r="7" fill="#ffffff"/>
  <rect x="446" y="854" width="410" height="40" rx="3" fill="#1a1a1a" stroke="#333"/>
  <text x="458" y="879" fill="#e6e6e6" font-size="14">chrome.exe</text>
  <text x="600" y="879" fill="#e6e6e6" font-size="14">Display</text>
  <rect x="750" y="862" width="50" height="24" rx="12" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <circle cx="762" cy="874" r="6" fill="#9a9a9a"/>
  <text x="446" y="916" fill="#8f8f8f" font-size="12">Checked 09:33 · ignored programs no longer keep the display on.</text>

  <text x="24" y="1140" fill="#555" font-size="12">Mock-up only (drawn from spec page 12, S1-S15), not the program.</text>
</svg>
