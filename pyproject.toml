[tool.poetry]
package-mode = false
name = "JoystickGremlin"
version = "1.0.31"
description = "Gremlin-Platforms R1. A tool for configuring and managing joystick devices."
authors = ["WhiteMagic <white.magic@gmx.de>"]
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://whitemagic.github.io/JoystickGremlin/"
repository = "https://github.com/WhiteMagic/JoystickGremlin"

[tool.poetry.dependencies]
jsonschema = ">=4.25"
miniaudio = ">=1.61"
python = ">=3.13, <3.14"
# Held below 6.12 (2026-10-08): with 6.12.0 the programs started off-screen
# by the tests crash (access violation) and menus come up different on CI
# (runs 37754952665, both attempts). To-do 39.
PySide6 = ">=6.8, <6.12"
PyInstaller = ">=6.10"
pywin32 = ">=308"
pytest = ">=9.0"
pytest-qt = ">=4.5.0"
pytest-rerunfailures = ">= 16.0"
ruff = "^0.15.7"
pyright = "^1.1.408"
python-osc = ">=1.8"
# OSC discovery (D-09-OSC-DISCOVERY); pinned, 0.147.0 is from 2025-05.
zeroconf = "0.147.0"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--import-mode=importlib"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
extend-exclude = ["gremlin/user_scripts/", "generate_wix.py", "resources.py", "dist", "doc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = ["ANN", "I", "E501"]

[tool.ruff.lint.per-file-ignores]
# Qt's display settings (high-DPI scaling) and the user folder are set up
# before Qt and the program's modules load, so most imports come after code.
"joystick_gremlin.py" = ["E402"]

[tool.pyright]
include = ["action_plugins", "dill", "gremlin", "joystick_gremlin.py", "vjoy"]
exclude = ["**/__pycache__", "**/.git", "**/.venv", "**/venv"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
